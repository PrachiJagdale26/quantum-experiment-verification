const statusClass=s=>({ok:'pass',cached:'pass',rate_limited:'hold',failed:'fail',skipped:'done'}[s]||'done');
const statusLabel=s=>({ok:'OK',cached:'From cache',rate_limited:'Rate-limited',failed:'Failed',skipped:'Skipped'}[s]||s);
function collectPanel(){
  const f=litForm,topics=meta.topics||[],rep=meta.lit_report,runs=meta.search_runs||[];
  const topic=topics.find(t=>t.key===f.topic);
  const srcBox=(k,label,note)=>`<label class="chk"><input type="checkbox" name="src" value="${k}" ${f.sources.includes(k)?'checked':''}> ${label}${note?` <span class="hint">${note}</span>`:''}</label>`;
  const report=rep?`<div class="panel"><h3>Last collection</h3><p class="sub">“${esc(rep.query)}”${rep.filters.year_from||rep.filters.year_to?`, ${esc(rep.filters.year_from||'…')}–${esc(rep.filters.year_to||'…')}`:''}. ${rep.unique} unique papers, ${rep.new} new to the database, ${rep.merged} matched papers already stored.</p>

      <td>${o.returned}</td><td>${o.new}</td><td>${o.merged}</td><td>${o.total_available!=null?Number(o.total_available).toLocaleString():'Not reported'}</td></tr>`).join('')}</tbody></table></div>`:'';
  const history=runs.length?`<details class="sec"><summary>Search history (${runs.length} most recent)</summary><table class="stack"><thead><tr><th>When</th><th>Source</th><th>Query</th><th>Status</th><th>Returned</th></tr></thead><tbody>
    ${runs.map(r=>`<tr><td class="nw">${esc(r.at)}</td><td>${esc(SRC_LABEL[r.source]||r.source)}</td><td>${esc(r.query)}</td><td class="nw"><span class="st ${statusClass(r.status)}">${statusLabel(r.status)}</span></td><td>${r.returned}</td></tr>`).join('')}</tbody></table></details>`:'';
  return `<section class="hero">${fringe}<h2>Collect quantum physics literature</h2>
    <p class="lead">Search scholarly databases and store what they return, with source links and retrieval times. Nothing is invented: when a source has no abstract, the paper is kept and marked metadata only.</p></section>
  <div class="board"><form class="panel form" id="litform" novalidate>
    <h3>Search</h3>
    <label for="lit-topic">Research area</label>
    <select id="lit-topic" class="in">${topics.map(t=>`<option value="${esc(t.key)}" ${t.key===f.topic?'selected':''}>${esc(t.label)}</option>`).join('')}<option value="" ${!f.topic?'selected':''}>Custom query</option></select>
    <label for="lit-query">Query</label>
    <input id="lit-query" class="in" placeholder="${esc(topic?topic.query:'e.g. GHZ state fidelity superconducting')}" value="${esc(f.query)}">
    <p class="hint">Leave empty to use the research area’s query. Put phrases in "quotes".</p>
    <div class="lf-row"><div><label for="lit-y1">From year</label><input id="lit-y1" class="in" inputmode="numeric" value="${esc(f.year_from)}" placeholder="Any"></div>
      <div><label for="lit-y2">To year</label><input id="lit-y2" class="in" inputmode="numeric" value="${esc(f.year_to)}" placeholder="Any"></div>
      <div><label for="lit-limit">Per source</label><select id="lit-limit" class="in">${['10','25','50','100'].map(n=>`<option ${n===f.limit?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <fieldset class="srcs"><legend>Sources</legend>${srcBox('openalex','OpenAlex',meta.openalex_key?'':'(shared daily budget without a key)')}${srcBox('arxiv','arXiv')}
      ${srcBox('crossref','Crossref')}${srcBox('semantic_scholar','Semantic Scholar',meta.s2_key?'':'(often rate-limited without a key)')}</fieldset>
    <p class="err" id="lit-err" hidden></p>
    <div class="row"><button class="btn primary" type="submit">Collect papers</button></div></form>
   <div class="side"><form class="panel form" id="doiform" novalidate><h3>Add one paper by DOI</h3>
      <label for="lit-doi">DOI</label><input id="lit-doi" class="in" placeholder="10.1038/s41586-023-06505-7" value="${esc(f.doi)}">
      <p class="err" id="doi-err" hidden></p><div class="row"><button class="btn" type="submit">Look up</button></div></form>
    <div class="panel"><h3>In the database</h3>
      <div class="fg"><span>Papers</span><b>${D.literature.length}</b></div>
      <div class="fg"><span>With abstract</span><b>${D.literature.filter(p=>p.availability!=='metadata_only').length}</b></div>
      <div class="fg"><span>Metadata only</span><b>${D.literature.filter(p=>p.availability==='metadata_only').length}</b></div>
      <div class="fg"><span>Full text</span><b>${D.literature.filter(p=>p.availability==='full_text').length}</b></div>
      <div class="fg"><span>Analysed</span><b>${D.literature.filter(p=>p.analysed).length}</b></div>
      <div class="fg"><span>Excluded</span><b>${D.literature.filter(p=>p.curation==='excluded').length}</b></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-litmode="corpus">Corpus analysis</button></div></div></div></div>
  <div class="stack-gap">${report}</div>${history}`;}
function litView(p){
  const [c,l]=AVAIL[p.availability],authors=p.authors.join(', ')+(p.author_count>p.authors.length?` and ${p.author_count-p.authors.length} more`:'');
  const link=(href,text)=>href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`:'';
  return `<section class="hero">${fringe}<div class="meta"><span>${esc(p.id)}</span><span>${esc([p.venue,p.date||p.year].filter(Boolean).join(', '))}</span><span class="chip ${c}">${l}</span>${p.is_open_access?'<span class="chip pass">Open access</span>':''}
    ${p.preprint_only?'<span class="chip hold" title="No journal or conference version recorded">Preprint or repository deposit</span>':''}${(p.work_types||[]).length?`<span>Type: ${esc(p.work_types.join(', '))}</span>`:''}</div>
    <h2>${esc(p.title)}</h2><p class="lead">${esc(authors||'Authors not listed by the source')}</p>
    <div class="act">${p.source_url?`<a class="btn primary" href="${esc(p.source_url)}" target="_blank" rel="noopener noreferrer">Open source page</a>`:''}
      ${p.pdf_url?`<a class="btn" href="${esc(p.pdf_url)}" target="_blank" rel="noopener noreferrer">Open PDF</a>`:''}
      ${p.arxiv_id&&p.availability!=='full_text'?`<button class="btn" data-act="lit_fulltext">Get full text from arXiv</button>`:''}
      ${p.availability!=='metadata_only'?`<button class="btn" data-act="lit_analyse">${p.analysed?'Analyse again':'Analyse paper'}</button>`:''}
      <button class="btn" data-litmode="collect">Collect more literature</button></div>
    <div class="curate" role="group" aria-label="Corpus decision"><span class="hint">In the corpus?</span>
      ${[['included','Include'],['excluded','Exclude'],['unreviewed','Undecided']].map(([k,l])=>`<button class="seg-b" data-curate="${k}" aria-pressed="${(p.curation||'unreviewed')===k}">${l}</button>`).join('')}
      <span class="hint">${p.curation==='excluded'?'Excluded papers are kept but never used for gaps or themes.':p.curation==='included'?'Used for gaps and themes.':'Undecided papers are used until you exclude them.'}</span></div></section>
  ${p.analysis?analysisPanel(p.analysis):''}
  <section class="board"><div class="panel"><h3>Abstract</h3>
    ${p.abstract?`<p class="sub">From ${esc(SRC_LABEL[p.abstract_source]||p.abstract_source||'source')}, verbatim.</p><p style="margin:0;max-width:72ch">${esc(p.abstract)}</p>`
      :`<p class="errbox" style="color:var(--hold);background:color-mix(in srgb,var(--hold) 10%,transparent)">No source returned an abstract for this paper, so only its metadata is stored. It can be cited but not analysed until the abstract or full text is available.</p>`}
    ${p.availability==='full_text'?`<p class="hint" style="margin-top:14px">Full text: ${p.fulltext_pages||'?'} pages, downloaded from arXiv (open access) and indexed in the knowledge base.</p>`:''}</div>
   <div class="side"><div class="panel"><h3>Identifiers</h3>
      <div class="fg"><span>DOI</span><b style="font-weight:400">${p.doi?link('https://doi.org/'+p.doi,p.doi):'None recorded'}</b></div>
      <div class="fg"><span>arXiv</span><b style="font-weight:400">${p.arxiv_id?link('https://arxiv.org/abs/'+p.arxiv_id,p.arxiv_id):'None recorded'}</b></div>
      <div class="fg"><span>OpenAlex</span><b style="font-weight:400">${p.openalex_id?link('https://openalex.org/'+p.openalex_id,p.openalex_id):'None recorded'}</b></div>
      ${p.cited_by!=null?`<div class="fg"><span>Cited by</span><b>${p.cited_by}</b></div>`:''}
      ${p.references?`<div class="fg"><span>References</span><b>${p.references}</b></div>`:''}</div>
    <div class="panel"><h3>Retrieved from</h3>${p.sources.map(s=>`<div class="fg"><span>${link(s.url,SRC_LABEL[s.name]||s.name)||esc(SRC_LABEL[s.name]||s.name)}</span><b style="font-weight:400">${esc(s.retrieved_at)} UTC</b></div>`).join('')}</div>
    ${p.versions.length?`<div class="panel"><h3>Versions</h3>${p.versions.map(v=>`<div class="fg"><span>${link(v.url,v.label)||esc(v.label)}</span><b style="font-weight:400">${esc(v.date||'date not given')}</b></div>`).join('')}</div>`:''}
    ${p.conflicts.length?`<div class="panel"><h3>Identifier conflicts</h3><p class="hint">Sources disagreed; the first value was kept.</p>${p.conflicts.map(x=>`<p class="cid">${esc(JSON.stringify(x))}</p>`).join('')}</div>`:''}</div></section>`;}
const KIND={direct:['pass','Quote, verified'],interpretation:['t-future_work','Interpretation, evidence verified'],
  unverified:['fail','Unverified: evidence not found in the paper'],inference:['hold','Inference across papers']};
function analysisPanel(a){
  const dims=Object.entries(a.dims).filter(([,v])=>v.length);
  return `<div class="stack-gap"><div class="panel"><h3>Research analysis</h3>
    <p class="sub">From the ${a.from==='full_text'?'full text':'abstract'}${a.llm?` by ${esc(a.llm)} plus the paper’s own sentences`:' using the paper’s own sentences (no live model)'}.
      ${a.counts.direct} verified quotes, ${a.counts.interpretation} verified interpretations${a.counts.unverified?`, <b class="fail">${a.counts.unverified} unverified</b> (shown, never used as evidence)`:''}.</p>
    ${a.warnings.length?`<p class="hint">${a.warnings.map(esc).join(' ')}</p>`:''}
    ${dims.length?`<div class="dims">${dims.map(([k,v])=>`<div><span class="hint">${esc(k)}</span><div>${v.map(x=>`<span class="chip t-future_work">${esc(x)}</span>`).join(' ')}</div></div>`).join('')}</div>`:''}
    ${a.fields.map(f=>`<h4 class="fh">${esc(f.label)} <span class="cnt">${f.items.length}</span></h4>
      ${f.items.map(it=>{const [c,l]=KIND[it.kind]||KIND.inference;return `<div class="stmt ${it.kind}">
        <p>${esc(it.text)}</p>
        <div class="stmt-meta"><span class="chip ${c}">${l}</span>${it.page?`<span>p. ${esc(it.page)}</span>`:''}<span>${esc(it.extractor==='rule-based'?'Paper’s own sentence':it.extractor)}</span><span>confidence ${it.confidence}</span></div>
        ${it.kind!=='direct'&&it.excerpt?`<details><summary>${it.verified?'Supporting passage':'Passage the model cited (not found)'}</summary><blockquote class="quote"><p>${esc(it.excerpt)}</p></blockquote></details>`:''}</div>`}).join('')}`).join('')}
  </div></div>`;}
function corpusView(){
  const c=meta.corpus,lits=D.literature,inc=lits.filter(p=>p.curation==='included').length,exc=lits.filter(p=>p.curation==='excluded').length,
    an=lits.filter(p=>p.analysed).length,todo=lits.filter(p=>!p.analysed&&p.curation!=='excluded'&&p.availability!=='metadata_only').length;
  const head=`<section class="hero">${fringe}<h2>Corpus analysis</h2><p class="lead">What the collected papers have in common and what they leave untouched. Everything here is an inference across papers and lists the papers behind it.</p>
    <div class="act"><button class="btn primary" data-act="corpus_run">${c?'Run again':'Run cross-paper analysis'}</button>
      ${todo?`<button class="btn" data-act="lit_analyse_next">Analyse next ${Math.min(5,todo)} of ${todo} unanalysed</button>`:''}
      <button class="btn" data-litmode="collect">Back to collecting</button></div>
    <p class="hint">${lits.length} papers: ${an} analysed, ${inc} included, ${exc} excluded, ${lits.length-inc-exc} undecided. Excluded and metadata-only papers are left out.</p></section>`;
  if(!c)return head+`<div class="panel"><p class="hint" style="margin:0">No cross-paper analysis yet. Analyse some papers, then run it.</p></div>`;
  const plink=x=>`<button class="link" style="padding:0;min-height:0" data-goto="literature:${esc(x.id)}">${esc(x.title)}</button>`;
  return head+`<div class="board"><div class="panel"><h3>Themes</h3><p class="sub">Papers grouped by meaning (${c.papers} analysed papers, ${esc(c.generated_at)} UTC). Labels name what is distinctive about each group.</p>
      ${c.themes.map(t=>`<details class="theme"><summary><b>${esc(t.label)}</b> <span class="cnt">${t.papers.length}</span></summary><ul class="plain">${t.papers.map(x=>`<li>${plink(x)}</li>`).join('')}</ul></details>`).join('')}</div>
    <div class="side"><div class="panel"><h3>Untried in this corpus</h3><p class="sub">Combinations no collected paper studies, although each side is studied by 2 or more papers. Absence here is not evidence of absence in the literature; Phase 4 checks that.</p>
      ${c.untried.length?c.untried.slice(0,10).map(u=>`<div class="fg"><span>${esc(u.row)} × ${esc(u.col)}</span><b style="font-weight:400">${u.row_papers} / ${u.col_papers}</b></div>`).join(''):'<p class="hint">None found.</p>'}</div></div></div>
  <div class="stack-gap"><div class="panel"><h3>Recurring limitations, open problems and future work</h3><p class="sub">Verified statements that two or more different papers make.</p>
    ${c.recurring.length?c.recurring.map(r=>`<div class="stmt inference"><p><b>${esc(r.representative)}</b></p><div class="stmt-meta"><span class="chip hold">${esc(r.field.replace('_',' '))}</span><span>${r.papers} papers</span></div>
      <details><summary>Statements</summary>${r.members.map(m=>`<blockquote class="quote"><p>${esc(m.text)}</p><cite>${plink(m)}${m.page?`, p. ${m.page}`:''}</cite></blockquote>`).join('')}</details></div>`).join('')
      :'<p class="hint">No statement recurs across papers in this corpus. Abstracts rarely state limitations; fetching full texts gives this more to work with.</p>'}</div>
  <div class="panel"><h3>Coverage: method × platform</h3>${c.method_platform.length?`<table class="stack"><thead><tr><th>Method</th><th>Platform</th><th>Papers</th></tr></thead><tbody>${c.method_platform.map(x=>`<tr><td>${esc(x.row)}</td><td>${esc(x.col)}</td><td>${x.n}</td></tr>`).join('')}</tbody></table>`:'<p class="hint">No paper names both a method and a platform.</p>'}</div></div>`;}
function loadingView(title,file,steps,step){
  const i=Math.min(step||0,steps.length-1);
  return `<section class="hero">${fringe}<div class="meta">${file?`<span>${esc(file)}</span>`:''}</div>
  <div class="tag run"><span class="ket">|ψ⟩</span>Working</div><h2>${esc(title)}</h2><div class="sk pulse" style="height:20px;max-width:420px;margin-top:14px"></div></section>
  <section class="board"><div class="panel"><ol class="steps" aria-label="Progress">${steps.map((s,j)=>`<li class="${j<i?'ok':j===i?'on':''}">${s}${j===i?'…':''}</li>`).join('')}</ol></div>
   <div class="panel"><div class="sk pulse" style="height:14px;width:60%;margin-bottom:10px"></div><div class="sk pulse" style="height:30px;width:40%;margin-bottom:22px"></div><div class="sk pulse" style="height:14px;width:70%;margin-bottom:10px"></div><div class="sk pulse" style="height:14px;width:50%"></div></div></section>`;}
function errorView(p){
  return `<section class="hero">${fringe}<div class="meta"><span>${esc(p.id)}</span><span>${esc(p.file)}</span></div>
  <div class="tag fail"><span class="ket">|∅⟩</span>Not read</div><h2>Couldn’t read ${esc(p.file)}</h2></section>
  <div class="panel" style="max-width:640px"><p style="margin-top:0">${esc(p.why)}</p>
  <div class="row"><label class="btn primary" for="file">Upload another file</label><button class="btn" data-act="${sec==='papers'?'remove_paper':'remove'}">Remove from list</button></div></div>`;}
function blank(){
  if(sec==='papers')return `<div class="blank">${bloch}<div><h2>Find what’s missing in the quantum literature</h2>
    <p>Add papers and Overlap reads them, finds research gaps across them, and designs experiments to fill those gaps, each checked by simulation.</p>
    <ul class="flow"><li><b>Papers</b>limitations, future work and experiments are extracted</li><li><b>Gaps</b>ranked by novelty, evidence and feasibility</li><li><b>Plans</b>a hypothesis, method and circuit, verified on a simulator</li></ul>
    <div class="row"><label class="btn primary" for="file">Upload papers</label><button class="btn" data-act="sample_papers">Load 4 sample papers</button></div>
    <p class="hint" style="margin-top:12px">Sample papers are synthetic, written to demonstrate the method.</p></div></div>`;
  if(sec==='gaps')return `<div class="blank">${bloch}<div><h2>Find research gaps</h2>
    <p>Gaps come from what analysed papers say they could not do, left open or leave for future work, and from method and platform pairs no paper in your corpus combines. Each gap can then be checked for novelty against OpenAlex, arXiv and Crossref.</p>
    <div class="row"><button class="btn primary" data-act="corpus_gaps" ${meta.analysed?'':'disabled'}>Find gaps in the corpus</button>${D.papers.length?`<button class="btn" data-act="find_gaps">Find gaps in uploaded papers</button>`:''}</div>
    <p class="hint" style="margin-top:12px">${meta.analysed?`${meta.analysed} analysed paper${meta.analysed===1?'':'s'} in the corpus.`:'No analysed papers yet: open Literature and analyse some first.'}</p></div></div>`;
  if(sec==='plans')return `<div class="blank">${bloch}<div><h2>No experiment plans yet</h2><p>Open a gap and choose “Plan an experiment”. Each plan is simulated and audited straight away.</p>
    <div class="row"><button class="btn primary" data-sec="gaps">Go to gaps</button></div></div></div>`;
  return `<div class="blank">${bloch}<div><h2>No proposals waiting for review</h2><p>Upload a single experiment proposal to check its circuit and claims directly.</p>
  <div class="row"><label class="btn primary" for="file">Upload proposal</label><button class="btn" id="sample">Try the sample Bell-state PDF</button><button class="btn" data-act="reload">Load benchmark cases</button></div></div></div>`;}
function render(){
  renderNav();renderRail();const p=cur();let html;
  if(busy&&busy.sec===sec)html=loadingView(busy.title,busy.file,busy.steps||STEPS[sec],busy.step);
  else if(sec==='literature')html=litMode==='corpus'?corpusView():(litMode==='collect'||!p)?collectPanel():litView(p);
  else if(sec==='runs')html=(runMode==='new'||!p)?runStart():runView(p);
  else if(!p)html=blank();
  else if(p.state==='run'||running[p.id])html=loadingView(sec==='papers'?'Analysing the paper':'Verifying',p.file,STEPS[sec],(running[p.id]||p).step);
  else if(p.state==='bad')html=errorView(p);
  else html=sec==='papers'?paperView(p):sec==='gaps'?gapView(p):p.kind==='proposal'?proposalView(p):verdictView(p);
  $('#main').innerHTML=html;}

function toast(msg,undo){$('#tmsg').textContent=msg;$('#undo').hidden=!undo;last=undo;$('#toast').hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').hidden=true,5000);}
setInterval(()=>{let ch=false;const bump=o=>{if(o&&(o.step||0)<9){o.step=(o.step||0)+1;ch=true}};
  [...pending.papers,...pending.proposals,...Object.values(running)].forEach(bump);bump(busy);if(ch)render();},900);
function go(s,id){sec=s;if(id)sel[s]=id;if(s==='literature'&&id)litMode='detail';if(!list().some(x=>x.id===sel[s]))sel[s]=list()[0]?.id;compose=null;err='';render();$('#pane').scrollTop=0;}
function download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast(`Downloaded ${name}`);}

/* ---------- data in from Python ---------- */
window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.type!=='streamlit:render')return;
  const a=d.args||{};meta=a.meta||{};
  if(d.theme&&d.theme.base)document.documentElement.dataset.theme=d.theme.base;
  D={literature:a.literature||[],papers:a.papers||[],gaps:a.gaps||[],plans:a.plans||[],proposals:a.proposals||[],runs:a.runs||[]};
  const done=new Set(meta.done||[]);
  pending.papers=pending.papers.filter(p=>!done.has(p.token));pending.proposals=pending.proposals.filter(p=>!done.has(p.token));
  for(const id in running){const it=D[running[id].sec].find(x=>x.id===id);if(!it||it.report_id!==running[id].was){delete running[id];if(it)toast('Verification re-run')}}
  for(const id in localDec){const it=D.proposals.find(x=>x.id===id);if(!it||!!it.dec===localDec[id])delete localDec[id]}
  if(meta.seq!==lastSeq){
    const first=lastSeq===null;lastSeq=meta.seq;busy=null;
    const f=a.focus||{};
    if((!first||f.initial)&&f.seq===meta.seq&&f.sec){sec=f.sec;if(f.id)sel[f.sec]=f.id;if(f.sec==='plans')ptab=f.tab||'plan';if(f.sec==='runs')runMode=null;
      if(f.sec==='literature')litMode=meta.lit_mode||(f.id?'detail':'collect');$('#pane').scrollTop=0;if(f.msg)toast(f.msg);}
  }
  for(const s of Object.keys(D)){const l=[...(pending[s]||[]),...D[s]];if(!l.some(x=>x.id===sel[s]))sel[s]=l[0]?.id;}
  render();});

/* ---------- events out to Python ---------- */
function upload(files){
  const token='u'+Date.now(),ok=['pdf','docx','txt'];
  if(sec==='proposals'){const f=files[0];const ext=(f.name.split('.').pop()||'').toLowerCase();
    pending.proposals.unshift({id:'New',title:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),file:f.name,state:'run',step:0,token});sel.proposals='New';render();
    if(!ok.includes(ext)){emit({kind:'upload',token,name:f.name,b64:''});return}
    const r=new FileReader();r.onload=()=>emit({kind:'upload',token,name:f.name,b64:String(r.result).split(',')[1]||''});r.readAsDataURL(f);return}
  files.forEach((f,i)=>pending.papers.unshift({id:`New ${i+1}`,title:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),file:f.name,state:'run',step:0,token}));
  sel.papers=pending.papers[0].id;render();
  Promise.all(files.map(f=>new Promise(res=>{if(f.size>25e6||!ok.includes((f.name.split('.').pop()||'').toLowerCase()))return res({name:f.name,b64:'',size:f.size});
    const r=new FileReader();r.onload=()=>res({name:f.name,b64:String(r.result).split(',')[1]||'',size:f.size});r.readAsDataURL(f);})))
    .then(arr=>emit({kind:'upload_papers',token,files:arr}));}
function act(kind){
  const p=cur();
  if(kind==='find_gaps'){busy={sec:'gaps',title:'Finding research gaps',step:0};sec='gaps';render();emit({kind});return}
  if(kind==='corpus_gaps'){busy={sec:'gaps',title:'Finding gaps in the corpus',step:0,steps:STEPS.corpus_gaps};sec='gaps';render();emit({kind});return}
  if(kind==='novelty_check'){busy={sec:'gaps',title:`Checking the novelty of ${p.id}`,file:p.title,step:0,steps:STEPS.novelty};render();emit({kind,id:p.id});return}
  if(kind==='gap_weights'){const weights={};document.querySelectorAll('[data-w]').forEach(i=>{const v=parseFloat(i.value);if(!isNaN(v))weights[i.dataset.w]=v});emit({kind,weights,id:p&&p.id});return}
  if(kind==='plan_gap'&&p.kind==='corpus'){busy={sec:'plans',title:`Drafting a proposal for ${p.id}`,file:p.title,step:0,steps:STEPS.proposal};sec='plans';render();emit({kind,gap_id:p.id});return}
  if(kind==='plan_redraft'){busy={sec:'plans',title:`Drafting a new proposal for ${p.gap_id}`,file:p.gap_title,step:0,steps:STEPS.proposal};render();emit({kind,gap_id:p.gap_id});return}
  if(kind==='run_new'){runMode='new';render();return}
  if(kind==='run_list'){runMode=null;render();return}
  if(kind==='run_resume_gap'){const v=(document.querySelector('input[name=rgap]:checked')||{}).value;if(!v){toast('Choose a gap first.');return}
    busy={sec:'runs',title:`Investigating ${v}`,file:p.title,step:0,steps:STEPS.run_gap};render();emit({kind:'run_resume',id:p.id,value:v});return}
  if(kind==='run_resume_plan'){busy={sec:'runs',title:'Continuing the run',file:p.title,step:0,steps:STEPS.run_plan};render();emit({kind:'run_resume',id:p.id,value:'continue'});return}
  if(kind==='run_retry'){busy={sec:'runs',title:'Retrying the failed step',file:p.title,step:0,steps:STEPS.run_gap};render();emit({kind,id:p.id});return}
  if(kind==='run_cancel'){emit({kind,id:p.id});return}
  if(kind==='plan_verify'){busy={sec:'plans',title:`Verifying ${p.id}, revision ${p.revision}`,file:p.title,step:0,steps:STEPS.verify};ptab='verdict';render();emit({kind,id:p.id});return}
  if(kind==='plan_edit_open'){editing=p.id;render();$('#pane').scrollTop=0;return}
  if(kind==='plan_edit_cancel'){editing=null;render();return}
  if(kind==='plan_gap'){busy={sec:'plans',title:`Planning an experiment for ${p.id}`,file:p.title,step:0};const gid=p.id;sec='plans';render();emit({kind,gap_id:gid});return}
  if(kind==='sample_papers'){const token='s'+Date.now();['A','B','C','D'].forEach((x,i)=>pending.papers.push({id:`New ${i+1}`,title:`Sample paper ${x}`,file:'synthetic sample',state:'run',step:0,token}));
    sec='papers';sel.papers=pending.papers[0].id;render();emit({kind,token});return}
  if(kind==='remove_paper'||kind==='remove'){emit({kind,id:p.id});return}
  if(kind==='lit_fulltext'){busy={sec:'literature',title:'Downloading the open-access PDF from arXiv',file:p.title,step:0};render();emit({kind,id:p.id});return}
  if(kind==='lit_analyse'){busy={sec:'literature',title:'Analysing the paper',file:p.title,step:0,steps:STEPS.analysis};render();emit({kind,id:p.id});return}
  if(kind==='lit_analyse_next'){busy={sec:'literature',title:'Analysing the next papers',file:'Up to 5 unanalysed papers',step:0,steps:STEPS.analysis};render();emit({kind,n:5});return}
  if(kind==='corpus_run'){busy={sec:'literature',title:'Comparing the papers',file:'',step:0,steps:STEPS.corpus};render();emit({kind});return}
  emit({kind});}
function decide(p,val,note){localDec[p.id]=val;emit({kind:'decide',id:p.id,dec:val,note:note||''});render();}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  const p=cur();
  if(t.id==='dash'){e.preventDefault();t.textContent='Opening dashboard…';emit({kind:'nav',page:'dashboard'});return}
  if(t.dataset.sec){go(t.dataset.sec);return}
  if(t.dataset.dl&&p&&p.verification){download(p.verification.md,`${p.id}-rev${p.verification.revision}-verification.md`);return}
  if(t.dataset.decide){const p2=cur(),note=($('#decnote')?.value||'').trim();
    if(t.dataset.decide!=='approved'&&note.length<10){toast('Add a short note (10+ characters) saying why.');$('#decnote')?.focus();return}
    emit({kind:'plan_decide',id:p2.id,decision:t.dataset.decide,note});toast('Saving your decision…');return}
  if(t.dataset.review){const p2=cur();if(p2)emit({kind:'gap_review',id:p2.id,status:t.dataset.review});return}
  if(t.dataset.curate){const p2=cur();if(p2)emit({kind:'lit_curate',id:p2.id,status:t.dataset.curate});return}
  if(t.dataset.litmode){litMode=t.dataset.litmode;render();$('#pane').scrollTop=0;return}
  if(t.dataset.goto){const [s,id]=t.dataset.goto.split(':');go(s,id);return}
  if(t.dataset.act){act(t.dataset.act);return}
  if(t.dataset.id){sel[sec]=t.dataset.id;if(sec==='literature')litMode='detail';if(sec==='runs')runMode=null;compose=null;err='';render();$('#pane').scrollTop=0;return}
  if(t.dataset.tab){if(sec==='plans')ptab=t.dataset.tab;else tab=t.dataset.tab;render();$(`#t-${t.dataset.tab}`)?.focus();return}
  switch(t.id){
    case 'sample':{const token='s'+Date.now();pending.proposals.unshift({id:'New',title:'sample bell state proposal',file:'sample_bell_state_proposal.pdf',state:'run',step:0,token});sel.proposals='New';render();emit({kind:'sample',token});break}
    case 'go':
      if(p.v==='pass'){decide(p,true);toast('Sent to panel',()=>decide(p,false))}
      else{compose=p.id;err='';render();$('#msg').focus()}break;
    case 'cancel':compose=null;err='';render();break;
    case 'reopen':decide(p,false);break;
    case 'rerun':running[p.id]={id:p.id,file:p.file,step:0,was:p.report_id,sec};emit({kind:sec==='plans'?'reverify':'rerun',id:p.id});render();break;
    case 'copy':Promise.resolve().then(()=>navigator.clipboard.writeText(p.json)).then(()=>toast('Report JSON copied'),()=>toast('Couldn’t copy: the browser blocked clipboard access'));break;
    case 'dlmd':download(p.md,`${p.report_id}.md`);break;
    case 'agenda':case 'agenda2':download(meta.agenda||'# Research agenda\n\nNo content yet.','research_agenda.md');break;
    case 'undo':$('#toast').hidden=true;last&&last();break;}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey)return;
  if(e.target.dataset&&e.target.dataset.tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const defs=sec==='plans'?PTABS:TABS,curT=sec==='plans'?ptab:tab,i=defs.findIndex(x=>x[0]===curT),n=(i+(e.key==='ArrowRight'?1:-1)+defs.length)%defs.length;
    if(sec==='plans')ptab=defs[n][0];else tab=defs[n][0];render();$(`#t-${defs[n][0]}`)?.focus();e.preventDefault();return}
  const l=list(),k=e.key.toLowerCase();if(!l.length||(k!=='j'&&k!=='k'))return;
  const i=l.findIndex(x=>x.id===sel[sec]),n=Math.min(l.length-1,Math.max(0,i+(k==='j'?1:-1)));
  if(n!==i){sel[sec]=l[n].id;render();$('#pane').scrollTop=0;document.querySelector(`[data-id="${CSS.escape(l[n].id)}"]`)?.focus()}});
/* Literature form and filters: values live in state so re-renders never wipe what was typed. */
const LIT_FIELDS={'lit-topic':'topic','lit-query':'query','lit-y1':'year_from','lit-y2':'year_to','lit-limit':'limit','lit-doi':'doi'};
const FILTER_FIELDS={'lf-text':'text','lf-avail':'availability','lf-src':'source','lf-y1':'year_from','lf-y2':'year_to'};
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(FILTER_FIELDS[id]){litFilter[FILTER_FIELDS[id]]=e.target.value;renderList();return}
  if(LIT_FIELDS[id]){litForm[LIT_FIELDS[id]]=e.target.value;if(id==='lit-topic'){const q=$('#lit-query'),t=(meta.topics||[]).find(x=>x.key===e.target.value);if(q)q.placeholder=t?t.query:'e.g. GHZ state fidelity superconducting'}return}
  if(e.target.name==='src'){litForm.sources=[...document.querySelectorAll('input[name=src]:checked')].map(x=>x.value);return}
});
function litSubmit(form){
  const showErr=(id,msg)=>{const el=$(id);el.textContent=msg;el.hidden=!msg;};
  if(form.id==='doiform'){
    const doi=litForm.doi.trim();
    if(!/^(https?:\/\/(dx\.)?doi\.org\/|doi:)?10\.\d{4,9}\/\S+$/i.test(doi)){showErr('#doi-err','That doesn’t look like a DOI. It starts with 10. followed by a slash, e.g. 10.1038/s41586-023-06505-7.');$('#lit-doi').focus();return}
    busy={sec:'literature',title:'Looking up the DOI in OpenAlex and Crossref',file:doi,step:0};render();emit({kind:'lit_doi',doi});return}
  const f=litForm,yr=v=>v===''||/^(19|20)\d{2}$/.test(v.trim());
  if(!f.query.trim()&&!f.topic){showErr('#lit-err','Enter a query or choose a research area.');$('#lit-query').focus();return}
  if(!yr(f.year_from)||!yr(f.year_to)){showErr('#lit-err','Years must be four digits, e.g. 2019.');return}
  if(f.year_from&&f.year_to&&+f.year_from>+f.year_to){showErr('#lit-err','“From year” is after “To year”.');return}
  if(!f.sources.length){showErr('#lit-err','Choose at least one source.');return}
  const topic=(meta.topics||[]).find(t=>t.key===f.topic);
  busy={sec:'literature',title:'Collecting papers',file:`“${f.query.trim()||(topic?topic.query:'')}” from ${f.sources.map(s=>SRC_LABEL[s]).join(', ')}`,step:0};render();
  emit({kind:'lit_collect',query:f.query.trim(),topic:f.topic,year_from:f.year_from.trim(),year_to:f.year_to.trim(),limit:f.limit,sources:f.sources});}
document.addEventListener('input',e=>{if(e.target.id==='msg'){drafts[sel[sec]]=e.target.value;
  if(err&&e.target.value.trim().length>=20){err='';const h=$('#msgh');h.className='hint';h.textContent='The check log goes with your note.';e.target.removeAttribute('aria-invalid')}}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='runform'){const f=runForm;f.query=$('#run-query').value.trim();f.topic=$('#run-topic').value;f.collect=$('#run-collect').checked;
    f.limit=$('#run-limit').value.trim();f.analyse_n=$('#run-analyse').value.trim();
    const bad=[f.limit,f.analyse_n].some(v=>v!==''&&!/^\d+$/.test(v));
    if(bad){const el=$('#run-err');el.textContent='Use whole numbers for the counts.';el.hidden=false;return}
    if(f.collect&&!f.query&&!f.topic){const el=$('#run-err');el.textContent='To collect papers, enter what to research or choose an area.';el.hidden=false;return}
    runMode=null;busy={sec:'runs',title:'Starting the run',file:f.query||((meta.topics||[]).find(t=>t.key===f.topic)||{}).label||'existing corpus',step:0,steps:STEPS.run_start};render();
    emit({kind:'run_start',query:f.query,topic:f.topic,collect:f.collect,limit:f.limit,analyse_n:f.analyse_n,sources:f.sources});return}
  if(e.target.id==='peform'){const p=cur();let changes;
    try{changes=collectEdit(p)}catch(err2){const el=$('#pe-err');el.textContent=err2.message;el.hidden=false;return}
    emit({kind:'plan_edit',id:p.id,changes,note:$('#penote').value});editing=null;toast('Saving…');return}
  if(e.target.id==='litform'||e.target.id==='doiform'){litSubmit(e.target);return}
  const p=cur(),v=(drafts[p.id]||'').trim();
  if(v.length<20){err=v?`Add ${20-v.length} more characters so the author knows what to change.`:'Add a note so the author knows what to change.';render();$('#msg').focus();return}
  compose=null;err='';decide(p,true,v);toast(DEC[p.v][1],()=>decide(p,false));});
$('#file').addEventListener('change',e=>{const fs=[...e.target.files];if(fs.length)upload(fs);e.target.value='';});

render();
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:window.innerHeight||900});
}

[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "minimal"

# ---------------------------------------------------------------------------
# Overlap design system, shared by the Overlap app and the full dashboard.
# Deep indigo by night, lavender by day; Sora for text, lilac/indigo for
# amplitudes and actions, mint / rose / gold for pass / fail / inconclusive.
# ---------------------------------------------------------------------------
[theme]
font = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 300
headingFontWeights = [400, 400, 500, 500, 500, 500]
headingFontSizes = ["2.1rem", "1.55rem", "1.2rem", "1.05rem", "1rem", "0.95rem"]
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

[theme.light]
primaryColor = "#4b3fd6"
backgroundColor = "#f6f5fd"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b1838"
borderColor = "#dcd9f0"
linkColor = "#4b3fd6"
codeBackgroundColor = "#eceaf9"
greenColor = "#0f7a5c"
redColor = "#c42d4a"
yellowColor = "#8f5e00"
violetColor = "#4b3fd6"
blueColor = "#4b3fd6"
chartCategoricalColors = ["#4b3fd6", "#0f7a5c", "#c42d4a", "#8f5e00", "#8a84d9", "#5f5c84"]

[theme.light.sidebar]
backgroundColor = "#eceaf9"
secondaryBackgroundColor = "#ffffff"
borderColor = "#dcd9f0"

[theme.dark]
primaryColor = "#b9b2ff"
backgroundColor = "#100f24"
secondaryBackgroundColor = "#17153a"
textColor = "#ecebff"
borderColor = "#2b2858"
linkColor = "#b9b2ff"
codeBackgroundColor = "#131130"
greenColor = "#5fe0b0"
redColor = "#ff7d8c"
yellowColor = "#f5c76b"
violetColor = "#b9b2ff"
blueColor = "#b9b2ff"
chartCategoricalColors = ["#b9b2ff", "#5fe0b0", "#ff7d8c", "#f5c76b", "#7d74e8", "#a3a1cc"]

[theme.dark.sidebar]
backgroundColor = "#131130"
secondaryBackgroundColor = "#17153a"
borderColor = "#2b2858"
